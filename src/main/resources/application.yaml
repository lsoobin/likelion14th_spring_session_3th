# Django의 settings.py에 해당하는 자리.
spring:
  application:
    name: springsession
  datasource:
    url: jdbc:mysql://localhost:3306/likelion_blog
    username: likelion
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
